# Configuration file for the proxyscan client (DNSBL / RBL Proxy Scanner)
nickname = P
username = proxyscan
hostname = undernet.org
userdescription = DNSBL Proxy Scanner

mode = +iok

# Admin channel where hits, alerts and GLINE reports are sent
adminchan = #gnuworld.message

# File where /msg P IGNORE entries are saved (static whitelist)
ignorefile = proxyscan.ignores

# Duration of GLINE applied to offending IP addresses (e.g. 1h, 24h, 7d, 3600)
gline_duration = 1h

# Seconds to cache glined IPs to avoid duplicate GLINEs across multiple RBL hits (300s = 5min)
cache_time = 300

# permit the given user -- by account login name -- to use the
# module. You may have as many of these as you like (including none).
# This is case-insensitive.
permit_user = reppir
permit_user = foo


# Set this to true if you want to permit opers to use the module,
# set to false otherwise (will not affect other users who have access)
allow_opers = true

# Colour the alerts in the admin channel (yes / no)
colours = yes

# Scan connecting clients during network burst (yes / no).
# Recommended: no (avoids scanning entire netburst upon linking)
scan_on_burst = no

# ----------------------------------------------------------------------------
# RBL / DNSBL Zone Definitions
# ----------------------------------------------------------------------------

# DroneBL
rbl.dronebl.zone = dnsbl.dronebl.org
rbl.dronebl.default_reason = DroneBL Listed
rbl.dronebl.reason.127.0.0.3 = IRC Drone / Botnet Node
rbl.dronebl.reason.127.0.0.5 = Spam / Injection Form
rbl.dronebl.reason.127.0.0.8 = Socks Proxy
rbl.dronebl.reason.127.0.0.9 = HTTP Proxy
rbl.dronebl.reason.127.0.0.255 = Unknown / Blacklisted Drone

# EFnet RBL
rbl.efnet.zone = rbl.efnetrbl.org
rbl.efnet.default_reason = EFnet RBL hit
rbl.efnet.reason.127.0.0.1 = Open Proxy
rbl.efnet.reason.127.0.0.2 = Spam / Malicious IRC
rbl.efnet.reason.127.0.0.3 = Tor Exit Node

# EvilNet RBL
rbl.evilnet.zone = rbl.evilnet.org
rbl.evilnet.default_reason = Evilnet RBL hit
rbl.evilnet.reason.127.0.0.3 = JoinPart flood
rbl.evilnet.reason.127.0.0.5 = Compromised HOST/IP
rbl.evilnet.reason.127.0.0.6 = IRC Spam Drone
rbl.evilnet.reason.127.0.0.7 = DDoS Drone
rbl.evilnet.reason.127.0.0.8 = Open Proxy / HTTP Proxy

# IRCBL
rbl.ircbl.zone = rbl.ircbl.org
rbl.ircbl.default_reason = IRCBL hit
