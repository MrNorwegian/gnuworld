# Config file for the spybot client
nickname = spybot
username = spybot
hostname = undernet.org
userdescription = Network traffic reporter

mode = +iok

# Channel that receives all reports (joined automatically)
adminchan = #spychan

# File where /msg spybot IGNORE entries are stored (optional)
ignorefile = spybot.ignores

# permit the given user -- by account login name -- to use the
# module. You may have as many of these as you like (including none).
# This is case-insensitive.
permit_user = reppir
permit_user = foo

# Set this to true if you want to permit opers to use the module,
# set to false otherwise (will not affect other users who have access)
allow_opers = true

# Optional channel that gets every raw P10/P11 line read from and written to
# the uplink (toggle at runtime with /msg spybot DEBUG ON|OFF)
#debugchan = #spydebug

# P10 commands left out of the debug channel (space or comma separated).
# Default: RI RO Z G (ping/pong).  Use e.g. 'RI RO Z G B EB EA' to cut burst noise too.
debugignore = RI RO Z G

# Colour the reports (nick/ident@host orange, servers yellow); use no for channels with +c
colours = yes

# mIRC colour per part of a report: 0-15 (or fg,bg such as 4,2), none = uncoloured
#  0 white  1 black  2 blue  3 green  4 red  5 brown  6 purple  7 orange
#  8 yellow  9 light green  10 teal  11 cyan  12 light blue  13 pink  14 grey  15 light grey
colour_nick = 7
colour_userhost = 7
colour_ip = 5
colour_channel = 11
colour_server = 8
colour_modes = 0
